name: Build OU DJ Studio APK

on:
  push:
    paths:
      - 'OU_DJ_Studio/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk             python3-pip autoconf libtool pkg-config zlib1g-dev             libncurses5-dev libncursesw5-dev libtinfo6 cmake             libffi-dev libssl-dev
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37
      - name: Build debug APK
        working-directory: OU_DJ_Studio
        run: buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OU-DJ-Studio-debug-apk
          path: OU_DJ_Studio/bin/*.apk
          if-no-files-found: error
          retention-days: 30
