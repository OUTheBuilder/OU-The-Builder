name: Build OU The Builder

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Verify and Build APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: OU_The_Builder_Foundation

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Verify project
        run: |
          set -euo pipefail
          test -f gradlew
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -d app/src
          chmod +x gradlew
          ./gradlew --version

      - name: Clean project
        run: |
          set -euo pipefail
          ./gradlew clean --stacktrace --no-daemon

      - name: Build APK
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL"
          echo "APK: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OU-The-Builder-debug-apk
          path: OU_The_Builder_Foundation/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Build complete
        run: |
          echo "OU THE BUILDER BUILD COMPLETE"
          echo "The APK has been uploaded as an artifact."
