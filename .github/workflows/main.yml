      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean project
        working-directory: OU_The_Builder_Foundation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean --stacktrace --no-daemon

      - name: Build APK
        working-directory: OU_The_Builder_Foundation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon
