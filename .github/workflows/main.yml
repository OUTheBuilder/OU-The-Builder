- name: Checkout
  uses: actions/checkout@v4

- name: Set up Java
  uses: actions/setup-java@v4
  with:
    distribution: temurin
    java-version: '17'

- name: Set up Android
  uses: android-actions/setup-android@v3

- name: Verify project
  run: |
    set -e

    echo "=== PROJECT VERIFICATION ==="

    test -f gradlew
    test -f settings.gradle || test -f settings.gradle.kts
    test -d app

    chmod +x gradlew

    echo "Gradle wrapper: OK"
    echo "App module: OK"

    ./gradlew --version

    echo "=== RUNNING GRADLE CHECKS ==="
    ./gradlew test

    echo "=== VERIFICATION COMPLETE ==="

- name: Build APK
  run: |
    set -e

    echo "=== BUILDING APK ==="
    ./gradlew assembleDebug --stacktrace

    echo "=== APK BUILD COMPLETE ==="

- name: Verify APK
  run: |
    set -e

    echo "=== SEARCHING FOR APK ==="

    APK=$(find . -type f -name "*.apk" | head -n 1)

    if [ -z "$APK" ]; then
      echo "ERROR: APK was not generated."
      exit 1
    fi

    echo "APK FOUND:"
    echo "$APK"

    ls -lh "$APK"

- name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: OU-The-Builder-debug-apk
    path: "**/*.apk"
    if-no-files-found: error
