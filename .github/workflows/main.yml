name: Inspect OU The Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect files
        shell: bash
        run: |
          echo "===== ROOT ====="
          pwd
          echo

          echo "===== TOP LEVEL ====="
          ls -la
          echo

          echo "===== ALL TRACKED FILES ====="
          git ls-files
          echo

          echo "===== GRADLE FILES ====="
          git ls-files | grep -E '(^|/)(gradlew|gradlew.bat|build.gradle|build.gradle.kts|settings.gradle|settings.gradle.kts|gradle.properties|gradle-wrapper.properties)$' || true
          echo

          echo "===== ACTUAL GRADLE FILES ON DISK ====="
          find . -type f \( \
            -name 'gradlew' -o \
            -name 'gradlew.bat' -o \
            -name 'build.gradle' -o \
            -name 'build.gradle.kts' -o \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' -o \
            -name 'gradle.properties' -o \
            -name 'gradle-wrapper.properties' \
          \) -print
          echo

          echo "===== ANDROID PROJECT ====="
          find . -type f -name 'AndroidManifest.xml' -print
          echo

          echo "===== FOUNDATION DIRECTORY ====="
          if [ -d "./OU_The_Builder_Foundation" ]; then
            ls -la "./OU_The_Builder_Foundation"
          else
            echo "OU_The_Builder_Foundation DOES NOT EXIST"
          fi
          echo

          echo "===== APP DIRECTORY ====="
          if [ -d "./OU_The_Builder_Foundation/app" ]; then
            find "./OU_The_Builder_Foundation/app" -maxdepth 4 -print
          else
            echo "APP DIRECTORY DOES NOT EXIST"
          fi
          echo

          echo "===== DONE ====="
