name: Prepare Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Generate Gradle Wrapper
        working-directory: OU_The_Builder_Foundation
        run: |
          set -e

          echo "======================================"
          echo " GENERATING GRADLE WRAPPER"
          echo "======================================"

          gradle wrapper --gradle-version 9.1.0

          echo ""
          echo "Checking generated files..."

          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "======================================"
          echo " GRADLE WRAPPER CREATED"
          echo "======================================"

          ls -lh gradlew
          ls -lh gradlew.bat
          ls -lh gradle/wrapper/

      - name: Upload Gradle Wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            OU_The_Builder_Foundation/gradlew
            OU_The_Builder_Foundation/gradlew.bat
            OU_The_Builder_Foundation/gradle/wrapper/gradle-wrapper.jar
            OU_The_Builder_Foundation/gradle/wrapper/gradle-wrapper.properties
