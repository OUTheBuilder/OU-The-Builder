name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inspect project
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== TOP LEVEL ====="
          ls -la

          echo "===== PROJECT FILES ====="
          find . -maxdepth 4 -type f | sort

          echo "===== GRADLE WRAPPERS ====="
          find . -name "gradlew" -type
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OU-The-Builder-debug
          path: OU_The_Builder_Foundation/app/build/outputs/apk/debug/*.apk
