name: Build OU The Builder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: OU_The_Builder_Foundation

    steps:
      # 1. Download repository source
      - name: Checkout source
        uses: actions/checkout@v5

      # 2. Install Java
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install/configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

