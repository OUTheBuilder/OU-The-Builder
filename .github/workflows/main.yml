name: Diagnose Android Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Full project diagnostic
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "OU THE BUILDER - ANDROID PROJECT DIAGNOSTIC"
          echo "=================================================="

          echo
          echo "===== 1. SYSTEM ====="
          uname -a
          echo
          java -version
          echo
          git --version

          echo
          echo "===== 2. REPOSITORY ROOT ====="
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          ls -la

          echo
          echo "===== 3. COMPLETE PROJECT TREE ====="
          find "$GITHUB_WORKSPACE" -maxdepth 6 -print | sort

          echo
          echo "===== 4. GRADLE WRAPPERS ====="
          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "gradlew" -o -name "gradlew.bat" \
            -print

          echo
          echo "===== 5. GRADLE CONFIGURATION FILES ====="
          find "$GITHUB_WORKSPACE" \
            -type f \
            \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle.properties" \
              -o -name "gradle-wrapper.properties" \
            \
            -print

          echo
          echo "===== 6. ANDROID MANIFESTS ====="
          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "AndroidManifest.xml" \
            -print

          echo
          echo "===== 7. KOTLIN / JAVA SOURCE ====="
          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.kt" -o -name "*.java" \
            -print | head -200

          echo
          echo "===== 8. ROOT SETTINGS FILE ====="

          for FILE in \
            "$GITHUB_WORKSPACE/settings.gradle" \
            "$GITHUB_WORKSPACE/settings.gradle.kts"
          do
            if [ -f "$FILE" ]; then
              echo "----- $FILE -----"
              cat "$FILE"
            fi
          done

          echo
          echo "===== 9. ALL BUILD GRADLE FILES ====="

          while IFS= read -r FILE; do
            echo
            echo "----- $FILE -----"
            cat "$FILE"
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "build.gradle" -o -name "build.gradle.kts" \
              -print
          )

          echo
          echo "===== 10. GRADLE PROPERTIES ====="

          while IFS= read -r FILE; do
            echo
            echo "----- $FILE -----"
            cat "$FILE"
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "gradle.properties" \
              -print
          )

          echo
          echo "===== 11. GRADLE WRAPPER PROPERTIES
