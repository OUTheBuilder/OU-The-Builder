name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inspect repository
        run: |
          echo "===== ROOT ====="
          pwd
          echo

          echo "===== DIRECTORY TREE ====="
          find . -maxdepth 5 -print | sort
          echo

          echo "===== GRADLE FILES ====="
          find . \( \
            -name "gradlew" -o \
            -name "gradlew.bat" -o \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \) -print

      - name: Build
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle project..."

          PROJECT_DIR=""

          for dir in \
            "." \
            "./OU_The_Builder_Foundation" \
            "./OU-The-Builder" \
            "./app"
          do
            if [ -f "$dir/gradlew" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo
            echo "ERROR: gradlew was not found."
            echo
            echo "Available files:"
            find . -maxdepth 5 -type f | sort
            echo
            exit 1
          fi

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo
          echo "===== GRADLE VERSION ====="
          ./gradlew --version

          echo
          echo "===== BUILDING APK ====="
          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        if: success()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OU-The-Builder-debug
          path: "**/build/outputs/apk/debug/*.apk"
