name: Diagnose OU The Builder

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Show repository structure
        run: |
          echo "=== Repository root ==="
          pwd
          echo ""
          echo "=== Files and folders ==="
          find . -maxdepth 4 -type f | sort
          echo ""
          echo "=== Gradle wrappers found ==="
          find . -name "gradlew" -o -name "gradlew.bat" | sort
          echo ""
          echo "=== settings.gradle files ==="
          find . -name "settings.gradle" -o -name "settings.gradle.kts" | sort
          echo ""
          echo "=== build.gradle files ==="
          find . -name "build.gradle" -o -name "build.gradle.kts" | sort
