name: Buiild OU The Builder

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Verify and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "ERROR: Android SDK was not found at: $SDK_ROOT"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "Using Android SDK: $SDK_ROOT"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Installed Android SDK packages:"
          "$SDKMANAGER" --list | sed -n '/Installed packages:/,/Available Packages:/p'

          if [[ ! -d "$SDK_ROOT/platforms/android-36" ]]; then
            echo "ERROR: Android platform 36 was not installed."
            exit 1
          fi

          if [[ ! -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
            echo "ERROR: Android Build Tools 36.0.0 were not installed."
            exit 1
          fi

          echo "Android SDK verification passed."

      - name: Verify project files
        working-directory: OU_The_Builder_Foundation
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -d app/src

          echo "Android project files found."

      - name: Ensure Gradle wrapper exists
        working-directory: OU_The_Builder_Foundation
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f gradlew ]]; then
            echo "ERROR: gradlew is missing."
            echo "Generate and commit the Gradle wrapper first."
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean project
        working-directory: OU_The_Builder_Foundation
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x ./gradlew
          ./gradlew clean \
            --stacktrace \
            --no-daemon

      - name: Build APK
        working-directory: OU_The_Builder_Foundation
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x ./gradlew
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        working-directory: OU_The_Builder_Foundation
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$(find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [[ -z "$APK" ]]; then
            echo "ERROR: APK was not generated."
            echo "Files found inside app/build:"
            find app/build -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK build successful:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OU-The-Builder-debug-apk
          path: OU_The_Builder_Foundation/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
