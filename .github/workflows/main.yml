name: Prepare Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.1'

      - name: Generate Gradle Wrapper
        working-directory: OU_The_Builder_Foundation
        run: |
          set -e

          gradle wrapper --gradle-version 9.1.1

          echo "=== WRAPPER GENERATED ==="

          ls -la
          ls -la gradle/wrapper

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar

          echo "Gradle wrapper is complete."

      - name: Upload generated wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            OU_The_Builder_Foundation/gradlew
            OU_The_Builder_Foundation/gradlew.bat
            OU_The_Builder_Foundation/gradle/wrapper/
