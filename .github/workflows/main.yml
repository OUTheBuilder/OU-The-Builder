name: Build OU The Builder

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Verify and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Diagnose Android SDK
        working-directory: .
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK root was not found."
            exit 1
          fi

          echo "SDK_ROOT=$SDK_ROOT"

          sdkmanager --sdk_root="$SDK_ROOT" --version

      - name: Install Android SDK packages
        working-directory: .
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK root was not found."
            exit 1
          fi

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager \
            --sdk_root="$SDK_ROOT" \
            --licenses || true

          echo "Installing Android SDK packages..."

          sdkmanager \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK installation complete."

      - name: Verify Android SDK
        working-directory: .
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          sdkmanager \
            --sdk_root="$SDK_ROOT" \
            --list_installed

      - name: Verify project
        working-directory: OU_The_Builder_Foundation
        run: |
          set -euxo pipefail

          echo "Checking project..."

          test -f gradlew
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -d app/src

          chmod +x gradlew

          echo "Project verification successful."
          ./gradlew --version

      - name: Clean project
        working-directory: OU_The_Builder_Foundation
        run: |
          set -euxo pipefail

          ./gradlew clean \
            --stacktrace \
            --info \
            --no-daemon

      - name: Build APK
        working-directory: OU_The_Builder_Foundation
        run: |
          set -euxo pipefail

          ./gradlew assembleDebug \
            --stacktrace \
            --info \
            --no-daemon

      - name: Verify APK
        working-directory: OU_The_Builder_Foundation
        run: |
          set -euxo pipefail

          echo "Searching for generated APK..."

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"
          echo ""
          echo "APK:"
          echo "$APK"
          echo ""

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OU-The-Builder-debug-apk
          path: OU_The_Builder_Foundation/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Build complete
        run: |
          echo ""
          echo "========================================"
          echo "OU THE BUILDER BUILD COMPLETE"
          echo "========================================"
          echo "APK uploaded successfully."
