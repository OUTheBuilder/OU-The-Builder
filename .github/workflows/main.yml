name: Build OU The Builder

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Verify and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " OU THE BUILDER - PROJECT VERIFICATION"
          echo "======================================"

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x gradlew

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          echo "Project structure: OK"

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      - name: Clean project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " CLEANING PROJECT"
          echo "======================================"

          ./gradlew clean --stacktrace

      - name: Compile APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " COMPILING OU THE BUILDER"
          echo "======================================"

          ./gradlew assembleDebug --stacktrace --info

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " VERIFYING APK"
          echo "======================================"

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Searching build directories:"
            find . -type d -name build -print
            exit 1
          fi

          echo "BUILD SUCCESSFUL"
          echo ""
          echo "APK FOUND:"
          echo "$APK"
          echo ""
          echo "APK SIZE:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OU-The-Builder-debug-apk
          path: "**/*.apk"
          if-no-files-found: error
