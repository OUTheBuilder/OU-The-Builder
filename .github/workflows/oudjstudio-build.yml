name: Build OU DJ Studio APK

on:
  push:
    paths:
      - 'OU_DJ_Studio/**'
      - '.github/workflows/oudjstudio-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up host Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf automake autopoint gettext libtool libtool-bin libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev
          java -version
          libtoolize --version
          aclocal --version

      - name: Verify pinned Android build configuration
        working-directory: OU_DJ_Studio
        run: |
          set -euxo pipefail
          grep -Eq '^requirements = .*python3==3\.12\.8.*hostpython3==3\.12\.8.*kivy==2\.3\.1' buildozer.spec
          grep -Eq '^android\.ndk = 25b$' buildozer.spec
          grep -Eq '^android\.minapi = 24$' buildozer.spec
          grep -Eq '^android\.api = 35$' buildozer.spec
          grep -Eq '^p4a\.branch = master$' buildozer.spec
          grep -Eq '^android\.archs = arm64-v8a$' buildozer.spec
          test -f p4a-recipes/python3/__init__.py
          test -f p4a-recipes/python3/android-disable-grp-enumeration.patch
          test -f p4a-recipes/python3/patches/pyconfig_detection.patch
          test -f p4a-recipes/python3/patches/reproducible-buildinfo.diff
          echo 'Pinned Python 3.12.8 / Android API 35 / min API 24 / NDK 25b / p4a master / arm64-v8a configuration and Python patches verified.'
          cat buildozer.spec

      - name: Install pinned Buildozer toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'buildozer==1.6.0' 'cython==0.29.37'
          buildozer --version
          cython --version

      - name: Build debug APK
        working-directory: OU_DJ_Studio
        env:
          P4A_RELEASE: '1'
        run: |
          set -o pipefail
          rm -rf .buildozer bin
          buildozer -v android debug 2>&1 | tee build-debug.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OU-DJ-Studio-debug-apk
          path: OU_DJ_Studio/bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log when build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OU-DJ-Studio-build-log
          path: OU_DJ_Studio/build-debug.log
          if-no-files-found: warn
          retention-days: 7
