name: OU DJ Studio - Test Android Python Build

on:
  push:
    paths:
      - 'OU_DJ_Studio/buildozer.spec'
      - '.github/workflows/oudjstudio-error-test.yml'

jobs:
  test-python-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf automake autopoint gettext libtool libtool-bin libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37
      - name: Test failing architecture only
        working-directory: OU_DJ_Studio
        run: |
          rm -rf .buildozer
          cp buildozer.spec buildozer.spec.test
          sed -i 's/^android.archs = .*/android.archs = armeabi-v7a/' buildozer.spec
          buildozer -v android debug
