name: OU DJ Studio Android grp patch check

on:
  push:
    branches: [ main ]
    paths:
      - 'OU_DJ_Studio/p4a-recipes/python3/android-disable-grp-enumeration.patch'
      - '.github/workflows/oudjstudio-grp-patch-check.yml'
  workflow_dispatch:

jobs:
  verify-android-grp-patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download matching CPython source
        run: |
          set -euo pipefail
          mkdir -p /tmp/cpython/Modules
          curl -fsSL https://raw.githubusercontent.com/python/cpython/v3.12.8/Modules/grpmodule.c \
            -o /tmp/cpython/Modules/grpmodule.c

      - name: Verify patch applies to CPython 3.12.8
        run: |
          set -euo pipefail
          cd /tmp/cpython
          patch --dry-run -p1 < "$GITHUB_WORKSPACE/OU_DJ_Studio/p4a-recipes/python3/android-disable-grp-enumeration.patch"
          patch -p1 < "$GITHUB_WORKSPACE/OU_DJ_Studio/p4a-recipes/python3/android-disable-grp-enumeration.patch"

      - name: Verify Android NDK macro selects safe branch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("/tmp/cpython/Modules/grpmodule.c").read_text()
          start = source.index("grp_getgrall_impl")
          start = source.index("{", start)
          end = source.index("\n}", start)
          function = source[start:end]

          guard = "#if defined(__ANDROID__) || defined(ANDROID)"
          assert guard in function, "Android macro guard is missing"
          android = function.split(guard, 1)[1].split("#else", 1)[0]
          native = function.split(guard, 1)[1].split("#else", 1)[1].split("#endif", 1)[0]

          assert "return PyList_New(0);" in android, "Android branch does not return an empty group list"
          for symbol in ("setgrent(", "getgrent(", "endgrent("):
              assert symbol not in android, f"{symbol} still appears in Android branch"
              assert symbol in native, f"{symbol} unexpectedly missing from native branch"

          print("Patch structure verified: Android branch avoids unavailable grp enumeration APIs.")
          PY

      - name: Compile Android preprocessor branch
        run: |
          set -euo pipefail
          cat > /tmp/grp-android-branch.c <<'C'
          typedef struct PyObject PyObject;
          PyObject *PyList_New(int);
          static PyObject *grp_getgrall_impl(void *module) {
          #if defined(__ANDROID__) || defined(ANDROID)
              return PyList_New(0);
          #else
              setgrent();
              return (PyObject *)getgrent();
          #endif
          }
          C
          clang -DANDROID -Werror=implicit-function-declaration -fsyntax-only /tmp/grp-android-branch.c
          echo "Android NDK macro branch compiles successfully."
