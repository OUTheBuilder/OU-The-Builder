name: OU DJ Studio Web Preview
on:
  push:
    paths:
      - 'OU_DJ_Studio/web-preview/**'
      - '.github/workflows/oudjstudio-web-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: OU_DJ_Studio/web-preview
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
