name: OU DJ Studio Python Android Compatibility Check

on:
  push:
    paths:
      - 'OU_DJ_Studio/p4a-recipes/python3/**'
      - 'OU_DJ_Studio/buildozer.spec'
      - '.github/workflows/oudjstudio-python-compat-check.yml'
  workflow_dispatch:

jobs:
  verify-grp-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Download CPython 3.12.8 source
        run: |
          mkdir -p /tmp/cpython/Modules
          curl -fsSL https://raw.githubusercontent.com/python/cpython/v3.12.8/Modules/grpmodule.c -o /tmp/cpython/Modules/grpmodule.c
      - name: Verify Android grp compatibility patch
        working-directory: /tmp/cpython
        run: |
          set -euo pipefail
          patch --dry-run -p1 < "$GITHUB_WORKSPACE/OU_DJ_Studio/p4a-recipes/python3/android-disable-grp-enumeration.patch"
          patch -p1 < "$GITHUB_WORKSPACE/OU_DJ_Studio/p4a-recipes/python3/android-disable-grp-enumeration.patch"
          python - <<'PY'
          from pathlib import Path
          source = Path("Modules/grpmodule.c").read_text()
          start = source.index("grp_getgrall_impl(PyObject *module)")
          end = source.index("\nstatic PyMethodDef grp_methods[]", start)
          method = source[start:end]
          guard = "#if defined(__ANDROID__) || defined(ANDROID)"
          assert guard in method, "Android NDK macro guard is missing"
          android_branch = method.split(guard, 1)[1].split("#else", 1)[0]
          native_branch = method.split(guard, 1)[1].split("#else", 1)[1].split("#endif", 1)[0]
          assert "return PyList_New(0);" in android_branch
          assert all(name not in android_branch for name in ("setgrent(", "getgrent(", "endgrent("))
          assert all(name in native_branch for name in ("setgrent(", "getgrent(", "endgrent("))
          print("PASS: Android NDK builds skip unsupported group enumeration; native behavior remains unchanged.")
          PY
      - name: Compile the Android-selected preprocessor branch
        run: |
          cat > /tmp/grp-android-branch.c <<'C'
          typedef struct PyObject PyObject;
          PyObject *PyList_New(int);
          static PyObject *grp_getgrall_impl(void *module) {
          #if defined(__ANDROID__) || defined(ANDROID)
              return PyList_New(0);
          #else
              setgrent();
              return (PyObject *)getgrent();
          #endif
          }
          C
          clang -DANDROID -Werror=implicit-function-declaration -fsyntax-only /tmp/grp-android-branch.c
          echo "PASS: NDK -DANDROID selects the safe branch."
