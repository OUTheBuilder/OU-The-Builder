name: OU DJ Studio ARM64 Python preflight

on:
  push:
    paths:
      - '.github/workflows/oudjstudio-arm64-preflight.yml'
      - 'OU_DJ_Studio/buildozer.spec'
      - 'OU_DJ_Studio/p4a-recipes/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-python-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDAPI=35" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager was not found on the GitHub runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-35" "ndk;25.1.8937393"
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/25.1.8937393" >> "$GITHUB_ENV"

      - name: Install Python-for-Android
        run: |
          python -m pip install --upgrade pip
          python -m pip install cython==0.29.37 git+https://github.com/kivy/python-for-android.git

      - name: Test only the failing Python Android runtime compile (ARM64)
        run: |
          python -m pythonforandroid.toolchain create \
            --dist_name=oudjstudio_arm64_preflight \
            --bootstrap=sdl2 \
            --requirements=python3==3.12.8 \
            --arch=arm64-v8a \
            --local-recipes=OU_DJ_Studio/p4a-recipes \
            --ndk-api=24 \
            --copy-libs \
            --debug
